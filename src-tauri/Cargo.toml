[package]
name = "watermarker"
version = "0.1.0"
description = "Watermark a folder of photos with a PNG or SVG."
authors = ["you"]
edition = "2021"

[lib]
name = "watermarker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp"] }
resvg = "0.44"
tiny-skia = "0.11"
base64 = "0.22"
rayon = "1"
num_cpus = "1"
# Used only for the preview path: gives us 1/8, 1/4, 1/2 scale-on-decode which
# image-rs's zune_jpeg backend no longer exposes. Batch output still goes
# through the `image` crate to keep encode behavior identical.
jpeg-decoder = "0.3"

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"

# Updater + process plugins are desktop-only. The frontend invokes update
# operations via our own `watermarker_updater_*` commands (not the
# `@tauri-apps/plugin-updater` JS API) because the channel choice — stable
# vs. beta — happens in Rust per call. `semver` powers the pick-newer
# logic; `tokio` enables `join!` for parallel manifest fetching.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
semver = "1"
tokio = { version = "1", features = ["macros", "rt"] }
