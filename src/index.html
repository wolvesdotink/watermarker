<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watermarker</title>
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <header class="titlebar" data-tauri-drag-region>
          <span class="titlebar-title">Watermarker</span>
          <button class="titlebar-button" id="settings-open" type="button" data-no-drag aria-label="Settings">
            <svg class="gear-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M13.766 2.276c-.367-.144-.85-.144-1.81-.144h-.044c-.962 0-1.444 0-1.811.144a2.04 2.04 0 0 0-1.116 1.105c-.097.226-.135.49-.15.876a1.59 1.59 0 0 1-.811 1.357 1.61 1.61 0 0 1-1.586.005c-.342-.184-.59-.286-.835-.32a2.058 2.058 0 0 0-1.503.398c-.322.247-.563.66-1.045 1.487l-.022.039c-.483.827-.724 1.241-.778 1.65-.072.535.066 1.078.39 1.515.149.2.36.366.69.572.49.305.806.81.806 1.376 0 .566-.316 1.07-.806 1.375-.33.206-.541.372-.69.572a2.034 2.034 0 0 0-.39 1.516c.054.41.295.823.778 1.65l.022.039c.482.826.723 1.24 1.045 1.486.434.333 1.013.479 1.503.4.244-.035.493-.137.835-.321a1.61 1.61 0 0 1 1.586.005c.491.286.79.802.81 1.357.016.387.054.65.151.876.187.531.586.93 1.116 1.105.367.144.85.144 1.811.144s1.443 0 1.81-.144a2.04 2.04 0 0 0 1.117-1.105c.097-.226.135-.49.15-.876a1.59 1.59 0 0 1 .811-1.357 1.61 1.61 0 0 1 1.586-.005c.342.184.59.286.835.32a2.058 2.058 0 0 0 1.503-.398c.323-.247.563-.66 1.046-1.487l.022-.039c.482-.827.723-1.24.777-1.65a2.034 2.034 0 0 0-.39-1.515c-.149-.2-.36-.367-.69-.572a1.612 1.612 0 0 1-.805-1.376c0-.565.316-1.07.806-1.375.33-.206.541-.372.69-.572a2.034 2.034 0 0 0 .39-1.516c-.054-.41-.295-.823-.778-1.65l-.022-.038c-.482-.827-.723-1.24-1.046-1.487a2.058 2.058 0 0 0-1.503-.399c-.244.034-.493.136-.835.32a1.61 1.61 0 0 1-1.586-.005 1.59 1.59 0 0 1-.81-1.357c-.016-.386-.054-.65-.151-.876a2.04 2.04 0 0 0-1.117-1.105ZM12 15.435a3.435 3.435 0 1 0 0-6.87 3.435 3.435 0 0 0 0 6.87Z"></path>
            </svg>
            <span class="titlebar-badge" id="settings-badge" hidden></span>
          </button>
        </header>

        <div class="sidebar-scroll" data-tauri-drag-region>
          <h2 class="group-title">Source</h2>
          <div class="card">
            <button class="row picker" id="pick-folder" type="button" data-no-drag>
              <span class="row-label">Photos folder</span>
              <span class="row-value picker-path" data-empty="Choose…"></span>
              <span class="row-chevron" aria-hidden="true">›</span>
            </button>
            <div class="row-sep" aria-hidden="true"></div>
            <button class="row picker" id="pick-watermark" type="button" data-no-drag>
              <span class="row-label">Watermark</span>
              <span class="row-value picker-path" data-empty="Choose…"></span>
              <span class="row-chevron" aria-hidden="true">›</span>
            </button>
            <div class="row-sep" aria-hidden="true"></div>
            <button class="row picker" id="pick-output" type="button" data-no-drag>
              <span class="row-label">Output</span>
              <span class="row-value picker-path" data-empty="Choose…"></span>
              <span class="row-chevron" aria-hidden="true">›</span>
            </button>
          </div>

          <h2 class="group-title">Watermark</h2>
          <div class="card">
            <div class="row slider-row" data-no-drag>
              <div class="slider-head">
                <label for="size">Size</label>
                <span class="val" id="size-val">20%</span>
              </div>
              <input type="range" id="size" min="1" max="100" step="1" value="20" />
            </div>
            <div class="row-sep" aria-hidden="true"></div>
            <div class="row slider-row" data-no-drag>
              <div class="slider-head">
                <label for="opacity">Opacity</label>
                <span class="val" id="opacity-val">100%</span>
              </div>
              <input type="range" id="opacity" min="0" max="1" step="0.01" value="1" />
            </div>
            <div class="row-sep" aria-hidden="true"></div>
            <div class="row slider-row" data-no-drag>
              <div class="slider-head">
                <label for="margin">Margin</label>
                <span class="val" id="margin-val">24 px</span>
              </div>
              <input type="range" id="margin" min="0" max="200" step="1" value="24" />
            </div>
          </div>

          <h2 class="group-title">Position</h2>
          <div class="card position-card" data-no-drag>
            <div class="position-grid" id="positions" role="radiogroup" aria-label="Watermark position">
              <button type="button" data-pos="top-left" role="radio" aria-label="Top left"></button>
              <button type="button" data-pos="top" role="radio" aria-label="Top"></button>
              <button type="button" data-pos="top-right" role="radio" aria-label="Top right"></button>
              <button type="button" data-pos="left" role="radio" aria-label="Left"></button>
              <button type="button" data-pos="center" role="radio" aria-label="Center"></button>
              <button type="button" data-pos="right" role="radio" aria-label="Right"></button>
              <button type="button" data-pos="bottom-left" role="radio" aria-label="Bottom left"></button>
              <button type="button" data-pos="bottom" role="radio" aria-label="Bottom"></button>
              <button type="button" data-pos="bottom-right" role="radio" aria-label="Bottom right"></button>
            </div>
          </div>

        </div>

        <footer class="sidebar-footer" data-no-drag>
          <button class="update-banner" id="update-banner" type="button" data-state="idle" hidden>
            <span class="update-banner-dot" aria-hidden="true"></span>
            <span class="update-banner-label" id="update-banner-label">Update available</span>
            <span class="update-banner-chevron" aria-hidden="true">›</span>
          </button>
          <button class="run" id="run" type="button">Watermark Photos</button>
          <div class="status" id="status"></div>
          <progress id="progress" value="0" max="1" hidden></progress>
        </footer>
      </aside>

      <section class="canvas" id="preview">
        <div class="canvas-inner">
          <div class="placeholder" id="placeholder">
            <div class="placeholder-glass" aria-hidden="true">
              <div class="placeholder-glyph"></div>
            </div>
            <div class="placeholder-title">No preview yet</div>
            <div class="placeholder-sub">Pick a photos folder and a watermark to begin.</div>
          </div>
          <img id="preview-img" alt="Preview" hidden />
          <div class="canvas-loader" id="canvas-loader" role="status" aria-live="polite" aria-label="Loading">
            <span class="spinner" aria-hidden="true"></span>
          </div>
        </div>
      </section>

      <div class="settings-drawer" id="settings-drawer" aria-hidden="true">
        <div class="settings-backdrop" id="settings-backdrop"></div>
        <aside class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <header class="settings-header">
            <h2 class="settings-title" id="settings-title">Settings</h2>
            <button class="settings-close" id="settings-close" type="button" aria-label="Close settings">
              <svg viewBox="0 0 14 14" aria-hidden="true">
                <path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
              </svg>
            </button>
          </header>
          <div class="settings-scroll">
            <h2 class="group-title">Output</h2>
            <div class="card">
              <div class="row slider-row" data-no-drag>
                <div class="slider-head">
                  <label for="jpeg-quality">JPEG quality</label>
                  <span class="val" id="jpeg-quality-val">90</span>
                </div>
                <input type="range" id="jpeg-quality" min="60" max="100" step="1" value="90" />
                <div class="row-hint">Higher = better detail, larger files. Only affects JPEG output.</div>
              </div>
            </div>

            <h2 class="group-title">Updates</h2>
            <div class="card update-card" id="update-card" data-state="idle">
              <div class="row update-row">
                <div class="update-status">
                  <span class="update-label" id="update-label">You're up to date</span>
                  <span class="update-version" id="update-version"></span>
                </div>
                <button class="update-action" id="update-action" type="button">Check</button>
              </div>
              <div class="update-progress-wrap" id="update-progress-wrap" hidden>
                <progress id="update-progress" value="0" max="1"></progress>
              </div>
              <div class="update-notes" id="update-notes" hidden></div>
              <div class="row-sep" aria-hidden="true"></div>
              <label class="row update-toggle-row">
                <span class="row-label">Receive beta updates</span>
                <span class="toggle">
                  <input type="checkbox" id="update-beta-toggle" />
                  <span class="toggle-switch" aria-hidden="true"></span>
                </span>
              </label>
            </div>
            <div class="app-version" id="app-version"></div>
          </div>
        </aside>
      </div>
    </main>
  </body>
</html>
